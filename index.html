<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^(https?:\/\/|\/|data:image\/(jpeg|png|webp);base64,)/.test(u||'')?u:'#',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'],fd=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',Math.max(2600,String(m).length*70))};
const CLN=v=>{v=String(v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u2028\u2029]/g,'').trim();try{if(v.toWellFormed)v=v.toWellFormed()}catch(e){}return v.slice(0,20000)};
const ER=(er,b)=>{const c=er&&er.code,m=String((er&&er.message)||'').slice(0,100);b=b||'Não foi possível salvar';
if(c=='resource_exhausted')return b+': muitas ações em pouco tempo (limite de chamadas). Aguarde ~30 segundos e tente de novo.';
if(c=='quota_exceeded')return b+': limite de armazenamento do painel atingido. Avise a supervisão. '+m;
if(c=='invalid_argument')return b+': dado grande demais ou inválido. '+m;
if(c=='unavailable')return b+': instabilidade momentânea, tente de novo.';
if(c=='revoked'||c=='not_granted')return b+': acesso retirado ou não concedido. Peça acesso de Colaborador à supervisão.';
return b+(c||m?' ('+(c?c+(m?' – ':''):'')+m+')':'')};
let db,user,assets,isEd=false;const S={};
const FX=[['Segunda','seg'],['Terça','ter'],['Quarta','qua'],['Quinta','qui'],['Sexta','sex'],['Sábado','sab'],['Domingo','dom']];
const CFG={
equipe:{t:'Equipe e horário fixo semanal',d:'Cadastre cada pessoa já com o turno fixo de segunda a domingo (deixe em branco o dia de folga). O quadro "Domingos" serve só para o revezamento de quem não tem domingo fixo.',ed:1,f:[['nome','Nome','text'],['nick','Nick (como será chamado/a)','text'],['funcao','Função','select',['Estagiário/a','Facilitadora artística','Convidado/a','Supervisão','Coordenação','Gestão']],['bio','Mini bio (aparece ao clicar na foto)','textarea'],['interesses','Áreas de interesse / o que quero aprender','text'],['email','E-mail','text'],['whats','WhatsApp (com DDD, só números)','text'],['nasc','Aniversário','date'],['foto','Foto (opcional)','img'],...FX.map(([l,k])=>[k,l+' (turno, ex.: 9h–17h)','text'])],r:i=>`<div class=erow>${AV(i,'sm')}<div><b>${esc(i.nome)}</b>${i.nick?` <span class=mut>“${esc(i.nick)}”</span>`:''} <span class=tag>${esc(i.funcao)}</span><div class=mut>${FX.map(([l,k])=>i[k]?l.slice(0,3)+' '+esc(i[k]):'').filter(Boolean).join(' · ')||'sem horário fixo cadastrado'}</div>${isEd?`<button type=button class="btn g" data-em="${i.id}" style="padding:4px 12px;margin:6px 0 0">✏️ Editar</button>`:''}${isEd&&MY?AN(i):''}</div></div>`},
domingos:{t:'Domingos',d:'Revezamento de domingos para quem não tem domingo fixo. Quem tem domingo no horário fixo da equipe já aparece automaticamente no calendário.',ed:1,sort:(a,b)=>(a.data||'').localeCompare(b.data||''),f:[['data','Domingo (data)','date'],['pessoa','Pessoa da equipe','team'],['turno','Turno (preenchido sozinho pelo contrato; pode ajustar)','text']],r:i=>`<div><b>${fd(i.data)}</b> <span class=tag>${esc(i.turno)}</span> ${esc(i.pessoa)}</div>`},
trocas:{t:'Folgas, trocas e coberturas',d:'Ajustes pontuais. Para uma troca, lance a ausência de uma pessoa e a cobertura da outra (uma linha para cada dia). Quem cobre cumpre o próprio turno de contrato, que o painel preenche sozinho.',ed:1,sort:(a,b)=>(a.data||'').localeCompare(b.data||''),f:[['data','Data','date'],['pessoa','Pessoa da equipe','team'],['tipo','Tipo','select',['Ausência / folga','Cobertura / turno extra']],['turno','Turno da cobertura (preenchido sozinho pelo turno de contrato de quem cobre)','text'],['obs','Motivo / observação','text']],r:i=>`<div><b>${fd(i.data)}</b> ${esc(i.pessoa)} <span class=tag>${esc(i.tipo)}</span>${i.turno?` <span class=mut>${esc(i.turno)}</span>`:''}<div class=mut>${esc(i.obs)}</div></div>`},
destaques:{t:'Destaques da home',d:'Avisos e novidades que aparecem na página inicial.',ed:1,f:[['titulo','Título','text'],['texto','Texto curto (opcional)','textarea'],['etiqueta','Etiqueta','select',['Novidade','Aviso','Prazo','Reunião','Material','Evento']],['dest','Ao clicar, abrir uma área do app','select',['Nenhuma (usar só o link)','Calendário','Obras','Jornada Educativa','Galeria','Jogo de cartas','Ideias de oficinas','Agendamentos','Equipe','Meus cadernos']],['link','Link externo (opcional)','text'],['img','Imagem (opcional)','img'],['fixo','Fixar no topo?','select',['Não','Sim']],['ate','Mostrar até (opcional)','date'],['oculto','Visibilidade','select',['Visível','Oculto (rascunho)']]],r:i=>`<b>${esc(i.titulo)}</b>`},

async function exifDate(f){try{const b=await f.slice(0,131072).arrayBuffer(),v=new DataView(b);if(v.getUint16(0)!=0xFFD8)return 0;let o=2;while(o<v.byteLength-4){const mk=v.getUint16(o),len=v.getUint16(o+2);if(mk==0xFFE1){if(v.getUint32(o+4)!=0x45786966)return 0;const t=o+10,le=v.getUint16(t)==0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le),ifd=(p,tag)=>{const n=g16(p);for(let i=0;i<n;i++){const e=p+2+i*12;if(g16(e)==tag)return g32(e+8)}return null},ex=ifd(t+g32(t+4),0x8769);if(ex==null)return 0;const d=ifd(t+ex,0x9003);if(d==null)return 0;const m=new TextDecoder().decode(new Uint8Array(b,t+d,19)).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():0}o+=2+len}}catch(e){}return 0}
